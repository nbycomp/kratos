# Receive OTLP telemetry from the OpenTelemetry Collector and print it.
<source>
  @type opentelemetry

  # Expand to opentelemetry.logs, opentelemetry.metrics, opentelemetry.traces according to received data.
  tag opentelemetry.${type}

  <grpc>
    bind 0.0.0.0
    port 4317
  </grpc>
</source>

# Enrich trace records with Kratos identity traits when an IdentityID is present.
# This uses a small in-memory cache to avoid calling Kratos for every event.
<filter opentelemetry.traces>
  @type kratos_enrich
  cache_ttl_seconds 60
</filter>

<match **>
  @type stdout
</match>
