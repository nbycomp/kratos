version: '3.7'

services:

  kratos:
    depends_on:
      - otel-collector
    environment:
      - TRACING_PROVIDER=otel
      ### OpenTelemetry Collector ###
      - TRACING_PROVIDERS_OTLP_SERVER_URL=otel-collector:4318
      - TRACING_PROVIDERS_OTLP_INSECURE=true

  # Receives spans from Kratos over OTLP, then fans them out to two pipelines:
  #   traces         — all spans forwarded to Grafana Tempo for visualisation
  #   traces/logout_get — only GET /self-service/logout spans printed to the
  #                       collector log (see contrib/quickstart/tracing/otel-collector-config.yaml)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./contrib/quickstart/tracing/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on:
      - tempo
      - fluentd
    networks:
      - intranet

  # Receives selected traces over OTLP and prints them to stdout.
  fluentd:
    build:
      context: .
      dockerfile: ./contrib/quickstart/tracing/fluentd.Dockerfile
    user: root
    environment:
      - KRATOS_ADMIN_URL=http://kratos:4434
    command: ["fluentd", "-c", "/fluentd/etc/fluentd.conf", "-p", "/fluentd/plugins", "-v"]
    volumes:
      - ./contrib/quickstart/tracing/fluentd.conf:/fluentd/etc/fluentd.conf
      - ./contrib/quickstart/tracing/fluentd-plugins:/fluentd/plugins
    networks:
      - intranet

  # Distributed trace storage backend.
  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./contrib/quickstart/tracing/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"  # Tempo HTTP API
    networks:
      - intranet

  # Visualisation UI — open http://localhost:3000 and use the Explore view
  # with the pre-configured Tempo datasource to search traces.
  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./contrib/quickstart/tracing/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3000:3000"  # Grafana UI
    depends_on:
      - tempo
    networks:
      - intranet
